<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body class="min-vh-100">
    <main class="d-flex flex-column mx-auto p-5">
        <h1 class="text-center">Amostragem Sistêmica</h1>

        <div class="d-flex justify-content-center">
            <form class="form-amostra row row-cols-1 row-cols-md-2 g-3 mt-4 p-5 w-100" id="formAmostra">
                <div class="col">
                    <label for="tamanhoPopulacao" class="form-label">Tamanho da população(N)</label>
                    <input type="text" class="form-control" id="tamanhoPopulacao">
                </div>

                <div class="col">
                    <label for="tamanhoAmostra" class="form-label">Tamanho da amostra</label>
                    <input type="text" class="form-control" id="tamanhoAmostra">
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary" id="btnEnviar">Enviar</button>
                </div>
            </form>
        </div>

        <div class="amostra mt-5 p-3" id="amostra">
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="./amostragemSistematica.js"></script>
</body>

</html>
